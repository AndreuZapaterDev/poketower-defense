<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- En móviles: sin zoom con dos dedos y ocupando también la zona de la muesca -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>PokéTower Defense</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7.5' fill='%23303030'/%3E%3Cpath d='M1.5 7.5a6.5 6.5 0 0 1 13 0z' fill='%23e83030'/%3E%3Cpath d='M1.5 8.5a6.5 6.5 0 0 0 13 0z' fill='%23f8f8f8'/%3E%3Ccircle cx='8' cy='8' r='2.5' fill='%23303030'/%3E%3Ccircle cx='8' cy='8' r='1.3' fill='%23f8f8f8'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #101820; overflow: hidden; }
      /* Los toques van al juego: sin desplazar la página, ni seleccionar texto, ni el menú de mantener pulsado */
      html, body, #game {
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

      /* Aviso para girar el móvil: el juego es apaisado */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #101820;
        color: #f8f8f8;
        font: 14px/1.8 'Press Start 2P', monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #rotate > div { max-width: 100%; }
      #rotate .phone {
        width: 40px;
        height: 64px;
        margin: 0 auto 24px;
        border: 4px solid #f8f8f8;
        border-radius: 8px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div>
        <div class="phone"></div>
        Gira el móvil para jugar
      </div>
    </div>
    <script>
      // El tamaño del mapa se calcula al cargar: si se abrió en vertical, se recarga al girarlo
      if (matchMedia('(orientation: portrait) and (pointer: coarse)').matches) {
        addEventListener('resize', () => {
          if (innerWidth > innerHeight) location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
