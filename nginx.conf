# Servidor de producción del juego (ver Dockerfile.prod)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los ficheros de assets/ generados por Vite llevan un hash en el nombre: se pueden cachear
    # para siempre. Los sprites y tiles de public/ no lo llevan, así que se cachean poco.
    # (la expresión va entre comillas porque lleva llaves)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 1h;
    }

    # index.html siempre fresco, para que se note enseguida una versión nueva
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
