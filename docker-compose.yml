services:
  game:
    build: .
    container_name: poketower-dev
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      # node_modules vive dentro del contenedor, no se mezcla con Windows
      - node_modules:/app/node_modules
    environment:
      # Necesario para detectar cambios de ficheros desde Windows
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"

volumes:
  node_modules:
